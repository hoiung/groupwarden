name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A master commit (2026-10-09): release v0.8.1 cannot read Go 1.27.2's
  # export data. Move back to a release once one can.
  STATICCHECK_VERSION: v0.7.0-0.dev.0.20261009230814-452d5bb86b45
  # A master commit (2026-10-12) on golang.org/x/tools v0.52.0: release
  # v2.29.0 is built on v0.49.0, which reads export data only up to
  # version 4, and Go 1.27.2 writes version 5. Move back to a release
  # built on x/tools v0.50.0 or later.
  GOSEC_VERSION: v2.29.1-0.20261012130337-71577268350e
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: docker build
        run: docker build -f deploy/Dockerfile -t groupwarden:ci .

      - name: The image runs the binary as non-root with its health check
        run: |
          test "$(docker run --rm groupwarden:ci fatal-exit-code)" = 78
          test "$(docker image inspect groupwarden:ci --format '{{.Config.User}}')" = nonroot:nonroot
          docker image inspect groupwarden:ci --format '{{json .Config.Healthcheck.Test}}' \
            | grep -F '"CMD","/groupwarden","healthcheck"'
          docker image inspect groupwarden:ci --format '{{json .Config.Env}}' | grep -F '"GROUPWARDEN_NO_SYNC_TIMER=1"'

      - name: The bot can write its database to a new /data volume
        run: |
          mkdir ci-config
          printf 'data_dir: /data\nsecrets_file: /config/secrets.env\nbackup:\n  target_dir: /backup\n' > ci-config/config.yaml
          docker volume create gw-ci-data
          docker run --rm -v gw-ci-data:/data -v "$PWD/ci-config:/config:ro" groupwarden:ci ban add 447700900123
          docker run --rm -v gw-ci-data:/data -v "$PWD/ci-config:/config:ro" groupwarden:ci ban list | grep -F 447700900123

  install-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: bash -n and shellcheck
        run: |
          bash -n deploy/install.sh
          shellcheck deploy/install.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The commit-message scan reads `git log <since>..HEAD`; a shallow
          # clone would miss that history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Install pinned analysers
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: staticcheck
        run: staticcheck ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: gosec
        run: gosec ./...

      - name: go test -race
        run: go test -race ./...

      - name: Secret detection (blocking)
        run: |
          EXTRA_FLAGS=""
          if [ -f .github/secret-scan-flags ]; then
            EXTRA_FLAGS=$(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ')
          fi
          # shellcheck disable=SC2086
          python3 scripts/check-public-repo-secrets.py . $EXTRA_FLAGS

      - name: Commit-message secret scan — push events (blocking)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ github.event.before }}
        run: |
          EXTRA_FLAGS=$(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ')
          # shellcheck disable=SC2086
          python3 scripts/check-public-repo-secrets.py $EXTRA_FLAGS \
            --scan-commit-messages \
            --since "$SINCE"

      - name: Commit-message secret scan — PR events (blocking)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ github.event.pull_request.base.sha }}
        run: |
          EXTRA_FLAGS=$(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ')
          # shellcheck disable=SC2086
          python3 scripts/check-public-repo-secrets.py $EXTRA_FLAGS \
            --scan-commit-messages \
            --since "$SINCE"
